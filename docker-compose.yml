version: '3.8'

services:
  agent:
    build:
      context: .
      dockerfile: agent_service/Dockerfile
    container_name: slugscheduler-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    networks:
      - slug_network

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: slugscheduler-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/app.db
      - DJANGO_AGENT_URL=http://agent:8000
      - JWT_SECRET=${JWT_SECRET:-ucsc-slug-smart-scheduling-secret-key-2026}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:5173}
    depends_on:
      - agent
    volumes:
      - sqlite_data:/app/data
    networks:
      - slug_network

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: slugscheduler-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - slug_network

volumes:
  sqlite_data:
    name: slugscheduler_sqlite_data

networks:
  slug_network:
    name: slugscheduler_network
