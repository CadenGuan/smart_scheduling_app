name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      # Report every Node version's result instead of cancelling the others on first failure
      fail-fast: false
      matrix:
        # The server uses the built-in node:sqlite module (unflagged from Node 22.13), so Node 20 can't run it
        node-version: [ 22.x, 24.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'agent_service/requirements.txt'

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python agent environment
        run: npm run setup:agent

      - name: Build shared workspace
        run: npm run build --workspace=shared

      - name: Lint and formatting checks
        run: |
          npm run lint
          npm run format:check

      - name: Typecheck TypeScript workspaces
        run: npm run typecheck

      - name: Start mock agent service
        # server/tests/agent.test.ts calls the Django agent on port 8000
        run: |
          cd agent_service
          USE_MOCK_AGENT=true AGENT_MODE=mock nohup .venv/bin/python manage.py runserver 8000 --noreload > "$RUNNER_TEMP/agent.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8000/api/agent/process/; then exit 0; fi
            sleep 1
          done
          echo "Agent service did not start:"; cat "$RUNNER_TEMP/agent.log"; exit 1

      - name: Run TypeScript test suites
        run: npm run test

      - name: Run Python agent test suite
        run: npm run test:agent

      - name: Build production bundles
        run: npm run build

  deploy-or-publish:
    name: Package & Release Artifacts
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Upload Client Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/
          retention-days: 7

      - name: Upload Server Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: |
            server/dist/
            shared/dist/
          retention-days: 7
