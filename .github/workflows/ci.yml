name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'agent_service/requirements.txt'

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python agent environment
        run: npm run setup:agent

      - name: Build shared workspace
        run: npm run build --workspace=shared

      - name: Lint and formatting checks
        run: |
          npm run lint
          npm run format:check

      - name: Typecheck TypeScript workspaces
        run: npm run typecheck

      - name: Run TypeScript test suites
        run: npm run test

      - name: Run Python agent test suite
        run: npm run test:agent

      - name: Build production bundles
        run: npm run build

  deploy-or-publish:
    name: Package & Release Artifacts
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Upload Client Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/
          retention-days: 7

      - name: Upload Server Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: |
            server/dist/
            shared/dist/
          retention-days: 7
